<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<meta name=referrer content=no-referrer>
<title>TeslaTV - your sign-in code</title>
<style>body{font-family:system-ui,sans-serif;max-width:600px;margin:auto;padding:16px}textarea{width:100%;height:110px;font-size:14px}button{padding:10px 16px;margin-top:8px}</style>
<h2>Tesla sign-in code</h2>
<p id=msg>Copy this code and paste it into the TeslaTV setup page ("4. Sign in to Tesla" &rarr; Code). Use it within a few minutes; it works only once.</p>
<textarea id=code readonly></textarea><br>
<button onclick="navigator.clipboard.writeText(document.getElementById('code').value).then(()=>this.textContent='Copied')">Copy code</button>
<p><small>This page runs only in your browser and sends the code nowhere.</small></p>
<script>
const q = new URLSearchParams(location.search);
if (q.get('error')) document.getElementById('msg').textContent = 'Tesla returned an error: ' + q.get('error') + ' ' + (q.get('error_description') || '');
document.getElementById('code').value = q.get('code') || '';
history.replaceState(null, '', location.pathname);   // drop the code from the address bar/history
</script>
